services:
  - type: web
    name: secure-login-lab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-login-lab-db
          property: connectionString

databases:
  - name: secure-login-lab-db
    plan: free